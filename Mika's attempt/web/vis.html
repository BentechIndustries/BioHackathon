<div class="cube-board">
    <header class="cube-head">
        <p class="cube-kicker">2x2x2</p>
        <h1 class="cube-title">Waiting</h1>
        <p class="cube-detail"></p>
        <p class="cube-note"></p>
    </header>
    <div class="cube-stage">
        <div class="cube-canvas-wrap">
            <canvas class="cube-canvas"></canvas>
            <p class="cube-hint">Drag to look around</p>
        </div>
        <aside class="cube-side">
            <section class="dish-card">
                <p class="side-label">Dish</p>
                <canvas class="dish-canvas"></canvas>
                <ul class="legend">
                    <li><i class="swatch colors"></i>Colors shown</li>
                    <li><i class="swatch green"></i>Active</li>
                    <li><i class="swatch blue"></i>Turn helped</li>
                    <li><i class="swatch ring-white"></i>Turn it picked</li>
                </ul>
            </section>
            <section class="net-card">
                <p class="side-label">Flat view</p>
                <canvas class="net-canvas"></canvas>
            </section>
        </aside>
    </div>
    <div class="cube-controls">
        <button type="button" class="mix-button">Mix</button>
        <button type="button" class="solve-button">Solve</button>
    </div>
</div>
