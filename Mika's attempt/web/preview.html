<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2x2x2</title>
    <link rel="stylesheet" href="vis.css">
    <style>
        html, body {
            margin: 0;
            background: #0c1020;
            min-height: 100%;
        }
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        .cube-board {
            width: min(960px, 100vw);
        }
    </style>
</head>
<body>
    <div id="host"></div>
    <script type="module">
        import { createVisualiser } from "./vis.mjs";

        const host = document.querySelector("#host");
        host.innerHTML = await (await fetch("./vis.html")).text();
        const visual = createVisualiser("preview", host);
        const packets = await (await fetch("./preview-sequence.json")).json();
        const hold = Number(new URLSearchParams(location.search).get("hold") || packets.length);
        for (const packet of packets.slice(0, hold)) {
            visual.process("cube", 0, packet);
        }
        let frame = 0;
        function tick(now) {
            frame += 1;
            if (frame % 3 === 0) {
                const channel = 1 + Math.floor(Math.random() * 54);
                visual.process("cl_spikes", frame, { channel });
            }
            if (frame % 28 === 0) {
                visual.process("cl_stims", frame, { channel: 8 + (frame % 40) });
            }
            visual.draw(now);
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    </script>
</body>
</html>
